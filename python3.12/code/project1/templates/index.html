<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>YOLO 智能视觉系统 | 检测·分类</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: clamp(1rem, 5vw, 2rem);
        }

        /* 毛玻璃主容器 */
        .glass-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: clamp(1rem, 4vw, 2rem);
            max-width: 1400px;
            margin: 0 auto;
            transition: all 0.3s ease;
        }

        h1 {
            text-align: center;
            color: white;
            font-weight: 600;
            font-size: clamp(1.5rem, 5vw, 2.2rem);
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .sub {
            text-align: center;
            color: rgba(255,255,255,0.85);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        /* 选项卡 */
        .tab-bar {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 0.7rem 1.8rem;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(4px);
            font-family: inherit;
        }

        .tab-btn.active {
            background: white;
            color: #764ba2;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .tab-btn:focus-visible {
            outline: 2px solid white;
            outline-offset: 2px;
        }

        /* 面板切换动画 */
        .panel {
            display: none;
            animation: fadeIn 0.25s ease;
        }

        .panel.active-panel {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 上传区域 */
        .upload-area {
            background: rgba(255,255,255,0.15);
            border: 2px dashed rgba(255,255,255,0.5);
            border-radius: 1.5rem;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1.5rem;
        }

        .upload-area.drag-over {
            background: rgba(255,255,255,0.3);
            border-color: white;
            transform: scale(0.98);
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .upload-text {
            color: white;
            font-weight: 500;
        }

        #fileInput {
            display: none;
        }

        /* 结果展示 */
        .result-container {
            background: rgba(0,0,0,0.25);
            border-radius: 1.5rem;
            padding: 1rem;
            margin-top: 1rem;
            text-align: center;
        }

        .result-image, .video-stream {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 1rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            background: #0f0f1a;
            display: block;
            margin: 0 auto;
        }

        .video-stream {
            width: 100%;
            height: auto;
        }

        .loading-spinner {
            display: inline-block;
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 1rem 0;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info-badge {
            background: rgba(0,0,0,0.6);
            color: #eee;
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-size: 0.85rem;
            display: inline-block;
            margin-top: 1rem;
            backdrop-filter: blur(2px);
        }

        .error-badge {
            background: rgba(220, 53, 69, 0.8);
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            color: rgba(255,255,255,0.7);
            font-size: 0.75rem;
        }

        button {
            background: none;
            border: none;
        }

        @media (max-width: 640px) {
            .tab-btn { padding: 0.5rem 1.2rem; font-size: 0.9rem; }
            .upload-area { padding: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="glass-card">
    <h1>✨ YOLO 智能视觉系统</h1>
    <div class="sub">目标检测 · 图像分类 | 实时推理</div>

    <div class="tab-bar" role="tablist" aria-label="功能切换">
        <button class="tab-btn active" data-tab="upload" role="tab" aria-selected="true">📷 图片上传</button>
        <button class="tab-btn" data-tab="camera" role="tab" aria-selected="false">🎥 摄像头实时</button>
    </div>

    <!-- 图片上传面板 -->
    <div id="uploadPanel" class="panel active-panel" role="tabpanel">
        <div class="upload-area" id="uploadArea" aria-label="点击或拖拽上传图片">
            <div class="upload-icon">🖼️</div>
            <div class="upload-text">点击或拖拽图片至此 (JPG/PNG)</div>
            <input type="file" id="fileInput" accept="image/jpeg,image/png,image/jpg" aria-label="选择图片文件">
        </div>
        <div id="uploadLoading" style="display: none; text-align: center;">
            <div class="loading-spinner"></div>
            <div class="info-badge">⏳ 正在执行检测 + 分类 ...</div>
        </div>
        <div id="uploadResult" class="result-container" style="display: none;">
            <img id="resultImg" class="result-image" alt="处理后图像">
            <div class="info-badge" id="resultInfo">✨ 处理完成</div>
        </div>
    </div>

    <!-- 摄像头实时面板 -->
    <div id="cameraPanel" class="panel" role="tabpanel">
        <div class="result-container">
            <img id="videoFeed" class="video-stream" alt="实时检测视频流" src="{{ url_for('video_feed') }}">
            <div class="info-badge">🔴 实时检测中 (仅目标检测，保证流畅)</div>
        </div>
    </div>
    <footer>⚡ 基于 YOLOv11 | 摄像头流由服务器端推理 | 图片模式同时返回检测+分类结果</footer>
</div>

<script>
    (function() {
        // DOM 元素
        const tabs = document.querySelectorAll('.tab-btn');
        const uploadPanel = document.getElementById('uploadPanel');
        const cameraPanel = document.getElementById('cameraPanel');
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadLoading = document.getElementById('uploadLoading');
        const uploadResultDiv = document.getElementById('uploadResult');
        const resultImg = document.getElementById('resultImg');
        const resultInfoSpan = document.getElementById('resultInfo');
        const videoImg = document.getElementById('videoFeed');

        // 辅助函数: 切换选项卡
        function switchTab(tabId) {
            // 更新按钮状态
            tabs.forEach(btn => {
                const isActive = btn.getAttribute('data-tab') === tabId;
                btn.classList.toggle('active', isActive);
                btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
            });
            // 更新面板显示
            const isUpload = (tabId === 'upload');
            uploadPanel.classList.toggle('active-panel', isUpload);
            cameraPanel.classList.toggle('active-panel', !isUpload);

            // 摄像头面板激活时，确保视频流加载（若因浏览器缓存问题可重设src）
            if (!isUpload && videoImg) {
                // 若图片加载失败（网络问题或后端未就绪），尝试重设src
                if (videoImg.complete && videoImg.naturalWidth === 0) {
                    const src = videoImg.src;
                    videoImg.src = '';
                    videoImg.src = src;
                }
            }
        }

        // 选项卡事件绑定 (事件委托也可，但直接绑定更清晰)
        tabs.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const tabId = btn.getAttribute('data-tab');
                if (tabId) switchTab(tabId);
            });
        });

        // ---------- 图片上传逻辑 ----------
        function showLoading() {
            uploadResultDiv.style.display = 'none';
            uploadLoading.style.display = 'block';
        }

        function hideLoading() {
            uploadLoading.style.display = 'none';
        }

        function showResult(imageBlob, fileName) {
            const url = URL.createObjectURL(imageBlob);
            resultImg.onload = () => {
                URL.revokeObjectURL(url);
            };
            resultImg.src = url;
            uploadResultDiv.style.display = 'block';
            resultInfoSpan.innerText = `✅ 完成 | ${fileName || '图片'} | 检测+分类`;
            resultInfoSpan.classList.remove('error-badge');
        }

        function showError(message) {
            hideLoading();
            uploadResultDiv.style.display = 'block';
            resultImg.src = '';
            resultInfoSpan.innerText = `❌ 错误: ${message}`;
            resultInfoSpan.classList.add('error-badge');
            setTimeout(() => {
                if (resultInfoSpan.classList.contains('error-badge')) {
                    resultInfoSpan.classList.remove('error-badge');
                }
            }, 4000);
        }

        async function uploadImage(file) {
            if (!file || !file.type.startsWith('image/')) {
                showError('请选择有效的图片文件');
                return;
            }
            // 限制文件大小 (10MB)
            if (file.size > 10 * 1024 * 1024) {
                showError('图片不能超过 10MB');
                return;
            }

            showLoading();
            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(errText || `HTTP ${response.status}`);
                }
                const imageBlob = await response.blob();
                showResult(imageBlob, file.name);
            } catch (err) {
                console.error('上传失败:', err);
                showError(err.message || '服务端处理失败，请检查后端');
            }
        }

        // 监听文件选择
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                uploadImage(e.target.files[0]);
                fileInput.value = ''; // 允许重复上传同一文件
            }
        });

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                uploadImage(file);
            } else {
                showError('请拖拽图片文件');
            }
        });
        // 点击上传区域触发文件选择
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // 可选：若摄像头视频流断开，尝试每5秒检测一次（仅在摄像头面板可见时）
        let videoRecoveryTimer = null;
        function startVideoHealthCheck() {
            if (videoRecoveryTimer) clearInterval(videoRecoveryTimer);
            videoRecoveryTimer = setInterval(() => {
                if (cameraPanel.classList.contains('active-panel') && videoImg) {
                    // 如果图像加载完成但宽度为0，说明可能加载失败
                    if (videoImg.complete && videoImg.naturalWidth === 0) {
                        console.log('视频流可能断开，尝试重连...');
                        const currentSrc = videoImg.src;
                        videoImg.src = '';
                        videoImg.src = currentSrc;
                    }
                }
            }, 5000);
        }
        startVideoHealthCheck();

        // 页面关闭时清除定时器
        window.addEventListener('beforeunload', () => {
            if (videoRecoveryTimer) clearInterval(videoRecoveryTimer);
        });
    })();
</script>
</body>
</html>
